asyncio:{title:'asyncio 与事件循环',category:'Python 后端',group:'python',emoji:'⌁',summary:'协程、事件循环与异步 I/O 的工作原理',lead:'在 I/O 密集型服务中，异步编程帮助我们在等待外部操作时处理其他任务。',sections:[['为什么需要 asyncio？','同步 I/O 在等待响应时通常会阻塞当前执行流程。asyncio 允许协程在 await 等待时让出执行权，由事件循环调度其他就绪任务。'],['事件循环与协程','协程是可以暂停和恢复的计算过程。事件循环负责安排协程继续执行，但这不等价于在单线程上并行执行 CPU 密集任务。'],['工程实践','尽量使用真正支持异步的数据库与 HTTP 客户端。将阻塞调用放进事件循环可能拖慢所有请求；CPU 密集型任务通常需要其他并行方案。']],code:'import asyncio\n\nasync def fetch(name):\n    await asyncio.sleep(0.3)\n    return f"{name}: ok"\n\nasync def main():\n    result = await asyncio.gather(fetch("A"), fetch("B"))\n    print(result)\n\nasyncio.run(main())',question:'什么时候使用 async def？'},

function calcMastery(topicId){const full=s.interviews.filter(x=>x.status==='completed').flatMap(x=>x.answers.filter(a=>a.topic===topicId&&!a.skipped&&a.answer.trim()).map(a=>a.answer));const incomplete=s.interviews.filter(x=>x.status==='incomplete').flatMap(x=>x.answers.filter(a=>a.topic===topicId&&!a.skipped&&a.answer.trim()).map(a=>a.answer));let ai='待评估',reason='完整面试中的相关证据不足，目前不作掌握判断。';if(full.length>=2){const avg=full.reduce((a,b)=>a+b.length,0)/full.length;ai=avg>=50?'基本掌握':'待加强';reason=`已参考 ${full.length} 条完整面试回答${incomplete.length?`，以及 ${incomplete.length} 条未完成场次辅助回答`:''}。演示中的判断仅按回答长度模拟，不代表真实知识水平。`;}else if(full.length===1){reason=`已有 1 条完整面试回答${incomplete.length?`和 ${incomplete.length} 条未完成场次辅助回答`:''}，不足以更新状态。`;}else if(incomplete.length){reason=`已有 ${incomplete.length} 条未完成面试辅助回答，不能单独更新状态。`;}const manual=s.manualMastery[topicId];return {ai,display:manual?.value||ai,manual:!!manual,reason,full:full.length,incomplete:incomplete.length};}

width:0"><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.title)}</span></button><button class="btn outline mini" data-delete-chat="${c.id}" title="删除会话" aria-label="删除会话">${I('trash',13)}</button></div>`).join('')}</div><div class="tiny muted mt16">历史只保存在当前浏览器。可折叠，不影响专题 AI 的独立记录。</div></aside>`:''}</div>`}

function configView(){let c=s.interviewConfig;let jdText=c.jd.trim();let suggested=c.role==='ai'?['agent','rag','rerank','llm']:['asyncio','fastapi','redis','mysql'];if(c.kind==='standard')suggested=c.domain==='python'?['asyncio','fastapi','redis','mysql']:['rag','rerank','agent','llm'];let found=['fastapi','redis','mysql','rag','agent','llm'].filter(id=>new RegExp(id==='llm'?'模型|llm':id,'i').test(jdText));if(c.kind==='role'&&found.length)suggested=[...found,...suggested.filter(x=>!found.includes(x))];return `${header('INTERVIEW PRACTICE','模拟面试','选择考察范围、训练模式和面试限制；正式模拟与练习的反馈机制不同。')}<div class="interview-config"><div class="card"><h2>配置一场模拟面试</h2><div class="form-group"><label class="label">1. 面试类型</label><div class="grid-2"><label class="selection ${c.kind==='standard'?'selected':''}"><input type="radio" name="kind" value="standard" ${c.kind==='standard'?'checked':''}/><span><b>标准题库</b><small>按知识领域组织问题</small></span></label><label class="selection ${c.kind==='role'?'selected':''}"><input type="radio" name="kind" value="role" ${c.kind==='role'?'checked':''}/><span><b>岗位定向</b><small>预设岗位 + 可选 JD</small></span></label></div></div>${c.kind==='standard'?`<div class="form-group"><label class="label">选择知识方向</label><select class="select" data-config="domain"><option value="python" ${c.domain==='python'?'selected':''}>Python 后端基础</option><option value="ai" ${c.domain==='ai'?'selected':''}>AI 应用 / RAG / Agent</option></select></div>`:`<div class="form-group"><label class="label">预设岗位</label><select class="select" data-config="role"><option value="ai" ${c.role==='ai'?'selected':''}>AI 应用 / Agent 开发实习</option><option value="python" ${c.role==='python'?'selected':''}>Python 后端开发实习</option></select></div><div class="form-group"><label class="label">粘贴招聘 JD（可选）</label><textarea class="textarea" data-draft="jd" placeholder="例如：熟悉 Python、FastAPI、Redis、RAG、Agent 等技术……">${esc(c.jd)}</textarea><div class="helper">原型仅按关键词演示考察重点变化，不执行真实 JD 语义解析。</div></div>`}<div class="form-group"><label class="label">2. 面试模式</label><div class="seg"><button data-config-set="mode:practice" class="${c.mode==='practice'?'active':''}">练习模式</button><button data-config-set="mode:formal" class="${c.mode==='formal'?'active':''}">正式模拟</button></div><div class="helper">${c.mode==='practice'?'练习允许跳题、逐题反馈。':'正式模拟不展示即时答案，结束后统一复盘。'}</div></div><div class="form-group"><label class="label">3. 面试限制</label><div class="seg"><button data-config-set="limit:count" class="${c.limit==='count'?'active':''}">按主问题数量</button><button data-config-set="limit:time" class="${c.limit==='time'?'active':''}">按时长</button></div><select class="select mt8" data-config="${c.limit==='count'?'count':'minutes'}">${(c.limit==='count'?[2,3,4]:[5,10,15]).map(n=>`<option value="${n}" ${n===(c.limit==='count'?c.count:c.minutes)?'selected':''}>${n}${c.limit==='count'?' 道主问题':' 分钟'}</option>`).join('')}</select></div><div class="btn-row"><button class="btn primary" data-action="start-interview">开始文字模拟面试 ${I('arrow',15)}</button></div></div><div class="card"><span class="tag teal">考察范围预览</span><h2 style="margin:16px 0 8px">${c.kind==='standard'?'标准题库训练':(c.role==='ai'?'AI 应用 / Agent 开发':'Python 后端开发')}</h2><p class="small-text muted">${c.kind==='role'&&jdText?'已结合 JD 关键词示意调整优先顺序。':'下方为本次预设的主要考察方向。'}</p><div class="stack">${suggested.map((id,i)=>`<div class="row"><span class="tag teal">${String(i+1).padStart(2,'0')}</span><span class="small-text">${T[id].title}</span></div>`).join('')}</div><div class="line"></div><p class="tiny muted">同一类型会覆盖多个知识点，追问随用户回答展开。此原型最多展示四道示例主问题，非真实题库抽样。</p><div class="callout amber">${I('info',15)} 原型中的提问、追问和报告均为演示逻辑。语音与简历个性化面试属于 P1，当前不提供真实功能。</div></div></div>`}
function questionSet(c){let ids=c.kind==='standard'?(c.domain==='python'?['asyncio','fastapi','redis','mysql']:['rag','rerank','agent','llm']):(c.role==='ai'?['agent','rag','rerank','llm']:['asyncio','fastapi','redis','mysql']);if(c.kind==='role'&&c.jd.trim()){let priority=ids.filter(id=>new RegExp(id==='llm'?'模型|llm':id,'i').test(c.jd));ids=[...priority,...ids.filter(i=>!priority.includes(i))]}return ids.slice(0,c.limit==='count'?Number(c.count):4)}
function interview(){if(!s.activeInterview)return configView();const a=s.activeInterview;const topicId=a.topics[a.index];const q=Q[topicId];const count=a.topics.length;let elapsed=Math.floor((Date.now()-a.started)/1000);let remaining=Math.max(0,a.minutes*60-elapsed);return `${header('LIVE INTERVIEW','正在模拟面试',`本次为${a.mode==='formal'?'正式模拟':'练习'}模式 · ${a.label} · 所有作答会保存为演示记录。`)}<div class="interview-layout"><div><div class="card" style="padding:20px"><div class="row between wrap"><span class="tag teal">${a.mode==='formal'?'正式模拟 · 结束后统一反馈':'练习模式 · 可跳题'}</span><div class="row"><span class="tag">主问题 ${a.index+1} / ${count}</span>${a.limit==='time'?`<span class="tag amber" id="countdown">剩余 ${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}</span>`:''}</div></div><div class="progress mt16"><span style="width:${Math.round(a.index/count*100)}%"></span></div><div class="question-box mt16"><small>${a.phase==='follow'?'动态追问':'核心问题'} · ${esc(T[topicId].category)} / ${esc(T[topicId].title)}</small><h2>${esc(a.phase==='follow'?q.follow:q.q)}</h2></div><div class="form-group mt24"><label class="label" for="interview-answer">你的回答</label><textarea class="textarea answer-area" id="interview-answer" placeholder="用自己的话作答，也可以填入示例回答体验流程……"></textarea><div class="helper">${a.mode==='formal'?'正式模拟中不展示即时答案。':'练习模式会在提交后提供单题反馈。'}</div></div>${a.feedback?`<div class="callout mt16"><b>练习反馈 · 演示</b><p style="margin:6px 0 0">${esc(a.feedback)}</p></div>`:''}<div class="btn-row mt16"><button class="btn primary" data-action="submit-answer">提交回答 ${I('arrow',15)}</button><button class="btn outline" data-action="sample-answer">填入示例回答</button>${a.mode==='practice'?'<button class="btn outline" data-action="skip-question">跳过本题</button>':''}<button class="btn danger" data-action="end-early">提前结束</button></div><div class="line"></div><button class="ghost" data-action="simulate-interruption">模拟意外中断（保存已提交回答）</button></div></div><aside class="card interview-side"><h3>面试进程</h3><div class="timeline">${a.topics.map((id,i)=>`<div class="${i===a.index?'current':''}">${esc(T[id].title)} ${i<a.index?'✓':i===a.index?'· 进行中':''}</div>`).join('')}</div><div class="line"></div><div class="tiny muted">已提交作答：${a.answers.filter(x=>!x.skipped).length} 条</div><div class="tiny muted">${a.limit==='time'?`时间限制：${a.minutes} 分钟（计时演示）`:`题量限制：${count} 道主问题`}</div><div class="callout amber mt16">一旦提前结束或中断，该场面试被标记为未完成，不能续答，也不会生成综合成绩。</div></aside></div>`}
function interviewTitle(x){return x.label||'技术模拟面试'}
function reports(){let all=s.interviews,selected=all.find(x=>x.id===s.selectedInterview)||all[0];if(!all.length)return `${header('INTERVIEW RECORDS','面试记录','查看完整面试报告或未完成场次的部分逐题复盘。')}<div class="empty"><h3>还没有面试记录</h3><p class="small-text muted">你可以选择标准题库或岗位，完成一场文字面试后在这里查看报告。</p><button class="btn primary" data-route="interview">开始模拟面试</button></div>`;return `${header('INTERVIEW RECORDS','面试记录','完整场次提供综合报告；未完成场次只分析已提交回答，不生成综合成绩。')}<div class="grid-2" style="grid-template-columns:minmax(250px,.8fr) minmax(0,1.3fr);align-items:start"><div class="card"><div class="row between"><h3 class="mb0">历史记录</h3><span class="tiny muted">${all.length} 场</span></div><div class="line"></div><div class="stack">${all.map(x=>`<button class="report-row" data-report="${x.id}" style="text-align:left;width:100%;background:${selected?.id===x.id?'#edf8f5':'#fff'}"><span><b>${esc(interviewTitle(x))}</b><span>${esc(x.date)} · ${x.answers.filter(a=>!a.skipped).length} 条回答</span></span><span class="tag ${x.status==='completed'?'teal':'amber'}">${x.status==='completed'?'已完成':'未完成'}</span></button>`).join('')}</div></div><div class="card">${selected?reportDetail(selected):''}</div></div>`}
function reportDetail(x){let incomplete=x.status==='incomplete';let answered=x.answers.filter(a=>!a.skipped);const involved=[...new Set(answered.map(a=>a.topic))];return `<div class="row between wrap"><span class="tag ${incomplete?'amber':'teal'}">${incomplete?'未完成 · 部分复盘':'已完成 · 完整报告'}</span><span class="tiny muted">${esc(x.date)}</span></div><h2 style="margin:14px 0 8px">${esc(x.label)}</h2><p class="small-text muted">${x.mode==='formal'?'正式模拟':'练习模式'} · ${x.kind==='role'?'岗位定向':'标准题库'} · 已提交 ${answered.length} 条回答${incomplete?` · ${x.reason||'提前结束'}`:''}</p>${incomplete?`<div class="callout amber"><b>本场面试未完成</b><br>仅对实际回答过的题目进行部分复盘；不生成综合分数，不默认生成正式学习任务，也不单独改变知识掌握状态。</div>`:`<div class="grid-3 mt16"><div class="report-stat"><div class="tiny muted">知识表达</div><strong>${Math.min(90,60+answered.length*5)}</strong><div class="tiny muted">演示评分</div></div><div class="report-stat"><div class="tiny muted">回答完整度</div><strong>${Math.min(92,62+answered.filter(a=>a.answer.length>35).length*8)}</strong><div class="tiny muted">演示评分</div></div><div class="report-stat"><div class="tiny muted">工程思考</div><strong>${Math.min(88,60+involved.length*6)}</strong><div class="tiny muted">演示评分</div></div></div><p class="tiny muted mt8">所有分数只用于界面演示，并非有效的 AI 能力测量。</p>`}<div class="section-head"><h2>逐题复盘</h2><span class="tiny muted">${answered.length} 条有效回答</span></div>${answered.length?involved.map((topicId)=>{let replies=x.answers.filter(a=>a.topic===topicId&&!a.skipped);return `<details class="accordion"><summary>${esc(T[topicId].title)} · ${replies.length} 次回答</summary><div class="inside"><p><b>主问题：</b>${esc(Q[topicId].q)}</p>${replies.map(a=>`<p><b>${a.follow?'追问':'主问题'}回答：</b>${esc(a.answer)}</p>`).join('')}<p><b>复盘建议（示意）：</b>${esc(Q[topicId].review)}</p><button class="btn outline small" data-topic="${topicId}">${I('book',14)} 进入相关知识专题</button></div></details>`}).join(''):`<div class="empty">本场没有成功提交的回答，因此没有可复盘的题目。</div>`}${incomplete?'':`<div class="section-head"><h2>推荐学习任务</h2><span class="tiny muted">需用户主动确认</span></div><p class="tiny muted">下面为基于考察范围生成的演示推荐，不是实际 AI 评估结论。</p>${x.topics.slice(0,2).map(id=>{let existing=s.tasks.find(t=>t.interviewId===x.id&&t.topic===id);return `<div class="next mt8"><div class="row between wrap"><div><b class="small-text">复习：${esc(T[id].title)}</b><div class="tiny muted">来源：本次完整面试 · ${esc(Q[id].q)}</div></div><button class="btn ${existing?'quiet':'primary'} small" ${existing?'disabled':''} data-add-task="${x.id}|${id}">${existing?'已加入学习计划':'确认加入任务'}</button></div></div>`}).join('')}`}<div class="section-head"><h2>知识掌握评估说明</h2></div><div class="callout">${incomplete?'此场有效回答可作为辅助证据，但不能单独触发掌握状态变化。':'完整面试回答可提供评估证据；单场结果通常仍不足以确定掌握状态。'} <button class="ghost" data-route="growth">查看掌握详情 →</button></div>`}
function tasks(){return `${header('LEARNING TASKS','学习任务','只有用户确认的 AI 推荐才会进入计划；任务完成不代表知识已经掌握。')}<div class="row wrap" style="margin-bottom:18px"><span class="tag">待完成 ${s.tasks.filter(t=>t.status==='todo').length}</span><span class="tag blue">进行中 ${s.tasks.filter(t=>t.status==='doing').length}</span><span class="tag teal">已完成 ${s.tasks.filter(t=>t.status==='done').length}</span></div>${s.tasks.length?s.tasks.map(t=>`<div class="task-row"><div style="flex:1"><b>${esc(t.title)}</b><p>推荐来源：${esc(t.source)} · 关联专题：${esc(T[t.topic].title)}</p><div class="row mt8"><button class="ghost" data-topic="${t.topic}">去学习专题 →</button><button class="ghost" data-report="${t.interviewId}">查看来源面试 →</button></div></div><select class="select" style="max-width:130px" data-task-status="${t.id}"><option value="todo" ${t.status==='todo'?'selected':''}>待完成</option><option value="doing" ${t.status==='doing'?'selected':''}>进行中</option><option value="done" ${t.status==='done'?'selected':''}>已完成</option></select></div>`).join(''):`<div class="empty"><h3>还没有已确认的学习任务</h3><p class="muted small-text">完成一场模拟面试，在完整面试报告中手动确认推荐任务后，这里才会出现任务。</p><button class="btn primary" data-route="interview">去模拟面试</button></div>`}<div class="callout mt24">${I('info',16)} 任务的三种状态仅代表计划执行情况。即使标记「已完成」，也不会自动把知识掌握改为「熟练」。</div>`}
function growth(){let n=s.completedTopics.length,recent=s.interviews[0],pending=s.tasks.filter(x=>x.status!=='done').length,weak=TOPIC_ORDER.filter(id=>calcMastery(id).display==='待加强').length;let view=s.growthTab;return `${header('PERSONAL GROWTH','我的成长','首页简洁展示四项核心概览；点击进入详情，历史成长趋势属于后续版本。')}<div class="grid-4">${[['learning','学习进度',`${n} / ${TOPIC_ORDER.length}`,'已完成章节'],['mastery','知识掌握',`${weak}`,'待加强知识点'],['interviews','最近面试',`${s.interviews.length}`,'累计面试记录'],['tasks','学习任务',`${pending}`,'待完成或进行中']].map(([key,name,num,d])=>`<button class="card grow-tile" style="text-align:left" data-growth="${key}"><span class="tiny muted">${name}</span><div style="font-size:29px;font-weight:800;margin:6px 0">${num}</div><div class="row between"><span class="tiny muted">${d}</span><span style="color:var(--primary)">${I('arrow',16)}</span></div></button>`).join('')}</div><div class="section-head"><h2>${({overview:'建议下一步',learning:'学习进度详情',mastery:'知识掌握详情',interviews:'面试历史详情',tasks:'学习任务详情'})[view]||'建议下一步'}</h2>${view!=='overview'?'<button class="ghost" data-growth="overview">返回概览 →</button>':''}</div>${view==='overview'?`<div class="grid-2"><div class="card"><h3>当前建议</h3>${pending?`<p class="small-text muted">你有 ${pending} 项已确认的学习任务，可以先从进行中的任务开始。</p><button class="btn primary small" data-growth="tasks">管理任务 ${I('arrow',14)}</button>`:`<p class="small-text muted">${recent?'可以回顾最近一次面试，再选择需要加强的知识。':'还没有面试记录，可先选择专题学习或直接模拟面试。'}</p><button class="btn primary small" data-route="${recent?'reports':'learn'}">${recent?'查看面试记录':'开始学习'} ${I('arrow',14)}</button>`}</div><div class="card"><h3>学习进度不等于掌握程度</h3><p class="small-text muted">阅读位置和任务状态分别记录；AI 只基于多次面试或练习的有效回答，审慎判断知识掌握程度。</p><button class="btn outline small" data-growth="mastery">查看掌握证据 ${I('arrow',14)}</button></div></div>`:view==='learning'?`<div class="card"><h3>知识章节学习状态</h3>${TOPIC_ORDER.map(id=>`<div class="row between" style="padding:12px 0;border-bottom:1px solid var(--border)"><div><b class="small-text">${esc(T[id].title)}</b><div class="tiny muted">阅读位置约 ${Math.round((s.readPos[id]||0)*100)}%</div></div><div class="row"><span class="tag ${completeFlag(id)?'teal':''}">${completeFlag(id)?'已确认完成':'未完成'}</span><button class="btn outline small" data-topic="${id}">继续</button></div></div>`).join('')}</div>`:view==='mastery'?`<div class="card"><div class="callout">AI 掌握状态是演示推断，不是有效的能力测试。未完成面试回答仅作辅助证据，不能单独修改状态。</div>${TOPIC_ORDER.map(id=>{let x=calcMastery(id);return `<div class="mastery-item"><div><b class="small-text">${esc(T[id].title)}</b><div class="tiny muted mt8">AI 判断：${x.ai} · 完整证据 ${x.full} 条，未完成辅助 ${x.incomplete} 条</div><div class="tiny muted">${esc(x.reason)}</div>${x.manual?'<div class="tiny" style="color:#247a73">当前状态由用户手动调整，AI 原判断保留。</div>':''}</div><div><label class="tiny muted">当前展示状态</label><select class="select" style="padding:8px;font-size:11px" data-mastery="${id}">${['待评估','待加强','基本掌握','熟练'].map(v=>`<option value="${v}" ${x.display===v?'selected':''}>${v}</option>`).join('')}</select>${x.manual?`<button class="ghost tiny" data-reset-mastery="${id}">恢复 AI 判断</button>`:''}</div></div>`}).join('')}</div>`:view==='interviews'?`<div class="card">${s.interviews.length?s.interviews.map(x=>`<div class="report-row"><div><b>${esc(x.label)}</b><span>${esc(x.date)} · ${x.status==='completed'?'完整报告':'部分逐题复盘'}</span></div><button class="btn outline small" data-report="${x.id}">查看 →</button></div>`).join(''):'<div class="empty">尚无面试记录。</div>'}</div>`:`<div class="card">${s.tasks.length?s.tasks.map(t=>`<div class="report-row"><div><b>${esc(t.title)}</b><span>${({todo:'待完成',doing:'进行中',done:'已完成'})[t.status]}</span></div><button class="btn outline small" data-route="tasks">管理 →</button></div>`).join(''):'<div class="empty">暂无已确认学习任务。</div>'}</div>`}<div class="callout mt24">基础历史成长趋势图、复杂能力雷达及详细数值评分属于 P1，本版原型不展示。</div>`}
function allKB(){return [{id:'base-python',name:'Python 后端',scope:'asyncio、FastAPI、Redis、MySQL',type:'public',builtIn:true},{id:'base-ai',name:'AI 应用开发',scope:'RAG、Agent、LLM、重排序',type:'public',builtIn:true},...((s.customKB?.public)||[]).map(x=>({...x,type:'public'})),...((s.customKB?.external)||[]).map(x=>({...x,type:'external'}))]}
function normalizeName(x){return String(x||'').toLowerCase().replace(/[\s_\-./·，,、:：]+/g,'')}
function checkKB(name,scope){const n=normalizeName(name),sc=normalizeName(scope),seed=['python','fastapi','redis','mysql','asyncio','后端','agent','rag','llm','模型','向量','检索','重排序','ai'];const res=[];for(const kb of allKB()){const kn=normalizeName(kb.name),ks=normalizeName(kb.scope);const exact=!!n&&n===kn;const nameSimilar=!!n&&(n.includes(kn)||kn.includes(n))&&n.length>=3&&kn.length>=3;const parts=seed.filter(w=>(n+sc).includes(w)&&(kn+ks).includes(w));if(exact||nameSimilar||parts.length>=2)res.push({name:kb.name,exact,similar:!exact,parts,type:kb.type})}return res}
function library(){const pub=allKB().filter(x=>x.type==='public');const ext=allKB().filter(x=>x.type==='external');const section=(type,items)=>`<section class="card kb-section"><div class="row between wrap"><div><div class="eyebrow">${type==='public'?'PUBLIC KNOWLEDGE':'EXTERNAL KNOWLEDGE'}</div><h2>${type==='public'?'公共知识库':'外部知识库'}</h2><p class="small-text muted">${type==='public'?'平台示例知识与本机新增知识库，正式共享发布和审核机制待后续确定。':'可登记外部资料来源，未来接入实际文档检索。当前只演示知识库条目。'}</p></div><button class="btn outline small" data-kb-add="${type}">${I('plus',15)} 新增${type==='public'?'公共':'外部'}知识库</button></div><div class="kb-items">${items.map(k=>`<div class="kb-row"><span class="topic-emoji">${type==='public'?'▤':'↗'}</span><div class="kb-row-body"><div class="row wrap"><b>${esc(k.name)}</b>${k.builtIn?'<span class="tag teal">平台示例</span>':'<span class="tag">本机新增</span>'}</div><div class="tiny muted">${esc(k.scope||'暂无范围说明')}${k.url?' · 已登记外部来源':''}${k.fileName?' · 文件名：'+esc(k.fileName):''}</div></div>${k.builtIn?`<button class="btn outline mini" data-study-group="${k.id==='base-python'?'python':'ai'}">浏览专题 →</button>`:`<span class="tiny muted">仅演示条目</span>`}</div>`).join('')||'<div class="kb-empty">暂无外部知识库。点击右上角“新增”，即可体验范围重合检查。</div>'}</div></section>`;return `${header('KNOWLEDGE LIBRARY','知识库','采用单栏上下布局：公共知识库在上，外部知识库在下；新增时检查与既有范围的重合。')}<div class="kb-column">${section('public',pub)}${section('external',ext)}</div><div class="callout mt24">说明：新建知识库及重合提示属于当前浏览器的交互原型，未接入真实文档入库、索引或分享。公共知识的实际新增权限、外部来源管理等将在技术架构与权限设计时确认。</div>`}

function afterRender(){if(s.route==='learn'){const el=document.getElementById('article-scroll');if(el){const p=s.readPos[s.activeTopic]||0;el.scrollTop=(el.scrollHeight-el.clientHeight)*p;el.addEventListener('scroll',()=>{const denom=el.scrollHeight-el.clientHeight;s.readPos[s.activeTopic]=denom>0?Math.max(0,Math.min(1,el.scrollTop/denom)):0;const percent=Math.round(s.readPos[s.activeTopic]*100);const t=document.getElementById('read-pct'),bar=document.getElementById('read-progress');if(t)t.textContent=percent+'%';if(bar)bar.style.width=percent+'%';clearTimeout(articleSaveTimer);articleSaveTimer=setTimeout(save,300)})}}if(s.route==='assistant'||s.route==='learn'){let m=document.getElementById(s.route==='assistant'?'free-messages':'topic-messages');if(m)m.scrollTop=m.scrollHeight}if(s.activeInterview){startTimer()}}
function startTimer(){if(interviewTimer)clearInterval(interviewTimer);if(!s.activeInterview||s.activeInterview.limit!=='time')return;interviewTimer=setInterval(()=>{const a=s.activeInterview;if(!a){clearInterval(interviewTimer);return}const rem=Math.max(0,a.minutes*60-Math.floor((Date.now()-a.started)/1000));let label=document.getElementById('countdown');if(label)label.textContent=`剩余 ${Math.floor(rem/60)}:${String(rem%60).padStart(2,'0')}`;if(rem===0){finishInterview(false,'时间到，面试已结束')}},1000)}
function sendTopic(){const input=document.getElementById('topic-input');let q=input?.value.trim();if(!q){notify('请输入问题');return}const arr=s.topicChats[s.activeTopic]||(s.topicChats[s.activeTopic]=[]);arr.push({who:'user',text:q});let scope=document.getElementById('topic-scope')?.value;arr.push({who:'ai',...autoReply(q,scope==='all'?null:s.activeTopic)});save();render();notify('专题问答已保存至当前专题的演示历史')}
function sendFree(){const input=document.getElementById('free-input');const q=input?.value.trim();if(!q){notify('请输入问题');return}let chat=s.freeChats.find(c=>c.id===s.chatId);if(!chat){chat={id:makeId('chat_'),title:'新对话',messages:[]};s.freeChats.unshift(chat);s.chatId=chat.id;s.historyOpen=true}chat.messages.push({who:'user',text:q});chat.messages.push({who:'ai',...autoReply(q)});if(chat.title==='新对话')chat.title=q.slice(0,17)+(q.length>17?'…':'');save();render()}
function newChat(question){s.route='assistant';s.chatId=null;s.historyOpen=!!s.freeChats.length;save();render();if(question){const input=document.getElementById('free-input');input.value=question;sendFree()}else document.getElementById('free-input')?.focus()}
function buildInterview(){let c={...s.interviewConfig},ids=questionSet(c);const label=c.kind==='standard'?(c.domain==='python'?'Python 基础题库':'AI 应用题库'):(c.role==='ai'?'AI 应用 / Agent 开发岗位':'Python 后端开发岗位');s.activeInterview={id:makeId('iv_'),kind:c.kind,label,mode:c.mode,limit:c.limit,minutes:Number(c.minutes),started:Date.now(),topics:ids,index:0,phase:'main',answers:[],feedback:'',date:date(),jd:c.jd};s.route='interview';save();render()}
function addAnswer(skip){const a=s.activeInterview;if(!a)return;const ta=document.getElementById('interview-answer');const answer=skip?'（跳过本题）':ta?.value.trim();if(!answer){notify('请输入回答，或填入示例回答');return}let topicId=a.topics[a.index];a.answers.push({topic:topicId,answer,follow:a.phase==='follow',skipped:skip});a.feedback='';if(skip){a.index++;a.phase='main'}else if(a.phase==='main'){a.phase='follow';if(a.mode==='practice')a.feedback='已收到主问题回答。可以在下一题继续说明原因、边界和工程场景。完整知识要点将在复盘报告中展示。'}else{a.index++;a.phase='main';if(a.mode==='practice')a.feedback='本知识点已完成演示练习。你可以在面试结束后查看本题复盘与参考专题。'}if(a.index>=a.topics.length){finishInterview(true,'正常完成');return}save();render();notify(skip?'本题已跳过':'回答已保存')}
function finishInterview(full,reason){const a=s.activeInterview;if(!a)return;clearInterval(interviewTimer);if(full&&!a.answers.some(r=>!r.skipped)){full=false;reason='无有效提交回答，无法生成完整报告'}let record={...a,status:full?'completed':'incomplete',reason,ended:Date.now()};s.interviews.unshift(record);s.selectedInterview=record.id;s.activeInterview=null;s.route='reports';save();render();notify(full?'面试完成，已生成演示综合报告':'面试未完成：已保存提交的作答，仅可查看部分逐题复盘')}
function addTask(interviewId,id){const interview=s.interviews.find(x=>x.id===interviewId);if(!interview||interview.status!=='completed'){notify('只有已完成场次才提供正式推荐任务');return}if(s.tasks.some(t=>t.interviewId===interviewId&&t.topic===id))return;s.tasks.unshift({id:makeId('task_'),topic:id,interviewId,title:`复习：${T[id].title}`,source:interview.label,status:'todo',created:date()});save();render();notify('已确认并加入学习计划，初始状态为待完成')}
function setConfig(name,value){s.interviewConfig[name]=(['count','minutes'].includes(name)?Number(value):value);save();render()}
function openReport(id){s.selectedInterview=id;s.route='reports';save();render();window.scrollTo(0,0)}
function handler(e){const el=e.target.closest('button,[data-topic],[data-chat],[data-report],[data-growth],[data-config-set],[data-delete-chat],[data-add-task],[data-study-group],[data-study-filter],[data-kb-add],[data-quick-ask]');if(!el)return;

if(el.dataset.topic){topic(el.dataset.topic);return}if(el.dataset.chat){s.chatId=el.dataset.chat;s.historyOpen=true;save();render();return}if(el.dataset.report){openReport(el.dataset.report);return}if(el.dataset.growth){s.growthTab=el.dataset.growth;save();render();return}if(el.dataset.configSet){let [key,value]=el.dataset.configSet.split(':');setConfig(key,value);return}if(el.dataset.deleteChat){const id=el.dataset.deleteChat;if(confirm('删除这段演示会话？删除后在当前浏览器中不可恢复。')){s.freeChats=s.freeChats.filter(c=>c.id!==id);if(s.chatId===id)s.chatId=null;save();render()}return}if(el.dataset.addTask){const [iv,id]=el.dataset.addTask.split('|');addTask(iv,id);return}if(el.dataset.studyGroup){s.courseFilter=el.dataset.studyGroup;s.learnView='catalog';s.route='learn';save();render();return}if(el.dataset.studyFilter){s.courseFilter=el.dataset.studyFilter;save();render();return}if(el.dataset.kbAdd){s.kbModal=el.dataset.kbAdd;render();return}if(el.dataset.quickAsk){s.route='assistant';newChat(el.dataset.quickAsk);return}
if(el.dataset.route){route(el.dataset.route);document.getElementById('sidebar')?.classList.remove('open');document.getElementById('nav-overlay')?.classList.remove('open');return}
switch(el.dataset.action){case'continue-reading':topic(s.activeTopic||firstTopic());break;
case'nav-toggle':document.getElementById('sidebar')?.classList.add('open');document.getElementById('nav-overlay')?.classList.add('open');break;
case'nav-close':document.getElementById('sidebar')?.classList.remove('open');document.getElementById('nav-overlay')?.classList.remove('open');break;
case'reset':if(confirm('清空当前浏览器中的全部原型演示记录并返回登录页？')){localStorage.removeItem(KEY);s=fresh();render();notify('已重置演示数据')}break;
case'open-api':s.apiModal=true;render();break;
case'close-modal':s.apiModal=false;s.kbModal=null;render();break;
case'save-api':sessionApiKey=(document.getElementById('api-key-input')?.value||'').trim();s.apiModal=false;render();notify(sessionApiKey?'已保存当前页面的演示配置；未执行真实 API 调用':'未输入 API Key，仍可体验演示内容');break;
case'learn-catalog':s.learnView='catalog';save();render();break;
case'history-toggle':s.historyOpen=!s.historyOpen;save();render();break;
case'kb-check':{const name=(document.getElementById('kb-name')?.value||'').trim(),sc=(document.getElementById('kb-scope')?.value||'').trim(),target=document.getElementById('kb-check-result');if(!target)break;if(!name){target.textContent='请输入知识库名称后再检查。';break}let matches=checkKB(name,sc);target.innerHTML=!matches.length?'<span style="color:#26776f">✓ 未发现明显同名或范围重合。注意：此为简单规则演示，并非语义去重。</span>':`<b>发现 ${matches.length} 个可能重合的知识库：</b><br>${matches.map(m=>`${esc(m.name)}（${m.type==='public'?'公共':'外部'}${m.exact?'，名称重复':m.parts.length?'，关键词交集：'+esc(m.parts.join('、')):'，名称相近'}）`).join('<br>')}`;break}
case'kb-create':{const kind=s.kbModal,name=(document.getElementById('kb-name')?.value||'').trim(),scope=(document.getElementById('kb-scope')?.value||'').trim(),url=(document.getElementById('kb-url')?.value||'').trim(),fileName=document.getElementById('kb-file')?.files?.[0]?.name||'';if(!kind||!name){notify('请填写知识库名称');break}const matches=checkKB(name,scope);if(matches.some(m=>m.exact)){notify('知识库名称已存在，请避免创建重名知识库');document.getElementById('kb-check-result').textContent='发现同名知识库，无法新增。请更换名称。';break}if(matches.length&&!confirm('发现可能重合的知识库：'+matches.map(m=>m.name).join('、')+'。仍要新增吗？'))break;if(!s.customKB)s.customKB={public:[],external:[]};s.customKB[kind].unshift({id:makeId('kb_'),name,scope,url,fileName});s.kbModal=null;save();render();notify('已新增本机演示知识库条目（尚未接入真实检索）');break}
case'toggle-complete':{let id=s.activeTopic;if(completeFlag(id))s.completedTopics=s.completedTopics.filter(x=>x!==id);else s.completedTopics.push(id);save();render();notify(completeFlag(id)?'已手动标记章节完成（不代表知识已掌握）':'已取消章节完成标记');break}
case'topic-send':sendTopic();break;
case'new-chat':s.route='assistant';newChat(el.dataset.question||'');break;
case'free-send':sendFree();break;
case'start-interview':buildInterview();break;
case'submit-answer':addAnswer(false);break;
case'skip-question':if(s.activeInterview?.mode==='practice')addAnswer(true);break;
case'sample-answer':if(s.activeInterview){document.getElementById('interview-answer').value=Q[s.activeInterview.topics[s.activeInterview.index]].example;notify('已填入演示回答，可点击提交')}break;
case'end-early':if(confirm('确定提前结束这场面试？将保留已提交回答，标记未完成，且不能续答。'))finishInterview(false,'主动提前结束');break;
case'simulate-interruption':if(confirm('模拟意外中断？本场只保留已提交回答，并标记未完成。'))finishInterview(false,'模拟意外中断');break;
case'future-upload':notify('个人知识库文件上传属于 P1。本版仅展示按钮，不会打开文件或上传资料。');break;

}}
function changeHandler(e){const t=e.target;if(t.dataset.targetChoice!==undefined){s.target=t.value;save();render();notify('已更新本机关注方向，可随时修改或清空');return}if(t.name==='target'){s.target=t.value;save();render();return}if(t.name==='kind'){s.interviewConfig.kind=t.value;save();render();return}if(t.dataset.config){setConfig(t.dataset.config,t.value);return}if(t.dataset.taskStatus){let task=s.tasks.find(x=>x.id===t.dataset.taskStatus);if(task){task.status=t.value;save();render();notify('任务状态已更新；这不等于知识掌握')};return}if(t.dataset.mastery){s.manualMastery[t.dataset.mastery]={value:t.value,date:date()};save();render();notify('已手动调整掌握状态，原始 AI 判断与证据保持不变');return}}
function inputHandler(e){const t=e.target;if(t.dataset.draft==='jd'){s.interviewConfig.jd=t.value;save()}}
function keyboard(e){if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){if(document.activeElement?.id==='topic-input'){e.preventDefault();sendTopic()}if(document.activeElement?.id==='free-input'){e.preventDefault();sendFree()}}}
document.addEventListener('click',handler);document.addEventListener('change',changeHandler);document.addEventListener('input',inputHandler);document.addEventListener('keydown',keyboard);
// Restore interrupted sessions as incomplete rather than pretending to support resuming.
if(s.activeInterview){const a=s.activeInterview;s.interviews.unshift({...a,status:'incomplete',reason:'页面刷新或浏览器中断',ended:Date.now()});s.selectedInterview=a.id;s.activeInterview=null;s.route='reports';save()}
render();
})();
</script>
</body>
