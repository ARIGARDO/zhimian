name: zhimian-m1
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: zhimian
      POSTGRES_DB: zhimian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhimian -d zhimian"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    # 无 ports：数据库不暴露到宿主机公网

  init:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://zhimian:${POSTGRES_PASSWORD:-local-dev-only}@postgres:5432/zhimian
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://zhimian:${POSTGRES_PASSWORD:-local-dev-only}@postgres:5432/zhimian
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.openai.com/v1}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_TIMEOUT: ${MODEL_TIMEOUT:-60}
      MODEL_AI_MAX_ATTEMPTS: ${MODEL_AI_MAX_ATTEMPTS:-3}
      MODEL_AI_MAX_OUTPUT_TOKENS: ${MODEL_AI_MAX_OUTPUT_TOKENS:-1024}
      MODEL_AI_MAX_DURATION_SECONDS: ${MODEL_AI_MAX_DURATION_SECONDS:-120}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_CACHE_DIR: /var/cache/zhimian-embedding
    volumes:
      - embedding-cache:/var/cache/zhimian-embedding
    depends_on:
      init:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready',timeout=5)"]
      interval: 10s
      timeout: 7s
      retries: 6
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  embedding-cache:
